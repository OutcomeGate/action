name: Feature request
description: Propose a public, credential-safe improvement to OutcomeGate.
title: "[Feature]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the capability without including customer information, private prompts, credentials, production traces, or unpublished evidence.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for the same request.
          required: true
        - label: This request can be discussed using only synthetic, public-safe examples.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What public use case is difficult today, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than a specific implementation.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Synthetic example
      description: Show the smallest invented workflow, input, and expected result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: boundary
    attributes:
      label: Security boundary
      options:
        - label: The proposal preserves the credential-free GitHub Action boundary, or clearly identifies a boundary change for review.
          required: true
