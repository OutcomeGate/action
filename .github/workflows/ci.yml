name: verify

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify

  action-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run the source action through the manifest-backed adapter boundary
        uses: ./
        with:
          suite: examples/counter/suite.json
          manifest: examples/counter/releases/agent.release.json
          adapter-manifest: examples/counter/adapter.manifest.json
          report: .agentci/action-smoke.json
          markdown: .agentci/action-smoke.md
