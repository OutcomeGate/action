# Developer Preview example pinned to the accepted runtime revision.
name: OutcomeGate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the candidate release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check declared agent outcomes
        # Review this immutable Developer Preview revision before use.
        uses: OutcomeGate/action@6bef6fecb4daa4a03c4fe5105776f9ce9351266a
        with:
          suite: examples/counter/suite.json
          manifest: examples/counter/releases/agent.release.json
          adapter-manifest: examples/counter/adapter.manifest.json
          report: .agentci/report.json
          markdown: .agentci/report.md
