# Starter template. Replace the all-zero revision before use.
name: agent-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the candidate release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check declared agent outcomes
        # REQUIRED: replace the all-zero value with a reviewed full commit SHA.
        uses: ConnorBarnhill/agent-ci-action@0000000000000000000000000000000000000000
        with:
          suite: examples/counter/suite.json
          manifest: examples/counter/releases/agent.release.json
          adapter-manifest: examples/counter/adapter.manifest.json
          report: .agentci/report.json
          markdown: .agentci/report.md
