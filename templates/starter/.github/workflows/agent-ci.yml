name: agent-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Reviewed full-SHA pin for actions/checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Accepted Apache-2.0 Developer Preview runtime. Review this immutable
      # revision before use; update only to another accepted full SHA.
      - uses: OutcomeGate/agent-ci-action@65c05affea57490e83959d6eeb4cbee5f6763935
        with:
          suite: agentci/suite.json
          manifest: agentci/release.manifest.json
          adapter-manifest: agentci/adapter.manifest.json
          report: .agentci/report.json
          markdown: .agentci/report.md
