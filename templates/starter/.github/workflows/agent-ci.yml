name: agent-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Reviewed full-SHA pin for actions/checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # REQUIRED: replace the all-zero placeholder with a reviewed full
      # 40-character commit SHA from the public Agent CI Action repository.
      # Do not replace it with a mutable branch or tag.
      - uses: ConnorBarnhill/agent-ci-action@0000000000000000000000000000000000000000
        with:
          suite: agentci/suite.json
          manifest: agentci/release.manifest.json
          adapter-manifest: agentci/adapter.manifest.json
          report: .agentci/report.json
          markdown: .agentci/report.md
